site_name: vernier
site_url: https://noefontana.github.io/vernier/
repo_url: https://github.com/NoeFontana/vernier
repo_name: NoeFontana/vernier
strict: true

docs_dir: docs

# adr/ and engineering/ are in-tree internal references; not user-facing.
# /README.md (anchored) is the top-level docs/README.md; docs/index.md is the
# landing page. Subdirectory READMEs (tutorials/README.md etc.) are the
# section landing pages — must not be excluded.
exclude_docs: |
  adr/**
  engineering/**
  /README.md

theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: false
            docstring_style: google
            members_order: alphabetical
            heading_level: 2
            docstring_section_style: table
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
  - redirects:
      redirect_maps:
        explanation/lvis-migration.md: migrate/from-lvis-api.md
        explanation/panoptic-migration.md: migrate/from-panopticapi.md
  - mike:
      alias_type: symlink
      canonical_version: stable

nav:
  - Home: index.md
  - Benchmarks: benchmarks.md
  - Comparison: comparison.md
  - Tutorials:
      - tutorials/README.md
      - Your first evaluation: tutorials/first-evaluation.md
      - Logging AP during training: tutorials/training-loop.md
      - Debugging with TIDE: tutorials/debugging-with-tide.md
  - Migrate:
      - migrate/README.md
      - From pycocotools: migrate/from-pycocotools.md
      - From faster-coco-eval: migrate/from-faster-coco-eval.md
      - From lvis-api: migrate/from-lvis-api.md
      - From mmsegmentation: migrate/from-mmsegmentation.md
      - From panopticapi: migrate/from-panopticapi.md
  - How-to:
      - how-to/README.md
      - Evaluate with the CLI: how-to/cli-eval.md
      - Inspect result tables: how-to/result-tables.md
      - Evaluate with boundary IoU: how-to/boundary-iou.md
      - Evaluate keypoints with OKS: how-to/keypoints-oks.md
      - Evaluate on a background thread: how-to/background-evaluator.md
  - Reference:
      - reference/README.md
      - Python API:
          - vernier: reference/python/vernier.md
          - vernier.instance: reference/python/instance.md
          - vernier.panoptic: reference/python/panoptic.md
          - vernier.semantic: reference/python/semantic.md
          - vernier.adapters: reference/python/adapters.md
      - CLI output schema: reference/cli-output-schema.md
      - COCO summary stats: reference/coco-summary-stats.md
  - Explanation:
      - explanation/README.md
      - Three paradigms (instance/panoptic/semantic): explanation/three-paradigms.md
      - TIDE and its limits: explanation/tide-and-its-limits.md
      - Why no per-image AP: explanation/why-no-per-image-ap.md
