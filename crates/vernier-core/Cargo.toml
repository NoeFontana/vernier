[package]
name = "vernier-core"
description = "Pure-Rust core for the vernier evaluation library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
pulp.workspace = true
# Pure-Rust mask kernels per ADR-0009. One-way dependency: core consumes
# the codec/rasterizer/ops surface; mask never depends on core.
vernier-mask = { path = "../vernier-mask", version = "0.0.0" }

[dev-dependencies]
proptest = { workspace = true }
# Benchmarks added when the first hot path lands; gated behind a feature
# so the main test suite stays fast.
