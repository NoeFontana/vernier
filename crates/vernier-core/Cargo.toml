[package]
name = "vernier-core"
description = "Pure-Rust core for the vernier evaluation library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Stage-0 instrumentation for the bbox-IoU optimization plan: records
# (kernel-kind, g_count, d_count, wall_ns) per `BboxIou::compute` and
# `BboxIou::compute_overlap_mask` call into a process-global Vec, dumped
# as CSV via `similarity::bbox::histogram::dump_csv`. Off by default so
# the shipped wheel never pays the recording cost.
bench-histogram = []
# Bbox-scaling instrumentation: process-global `AtomicU64` accumulators
# that split `evaluate_with_parallel` wall time into `par_iter_region`
# (the rayon dispatch) and `serial_post` (output fold + retained-iou
# sort), plus a counter of `build_gt_anns` / `build_dt_anns` calls.
# Surfaced via `read_and_reset_evaluate_parallel_timings()` /
# `read_and_reset_build_anns_count()`. Off by default so the shipped
# wheel never pays the per-call `Instant::now()` cost.
bench-timings = []

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
pulp.workspace = true
# Pure-Rust mask kernels per ADR-0009. One-way dependency: core consumes
# the codec/rasterizer/ops surface; mask never depends on core.
vernier-mask = { path = "../vernier-mask", version = "0.2.0" }
# Shared partial wire envelope and merge policy (ADR-0032). Carries
# magic + version + framing + the five typed errors used by all three
# paradigms. Each crate that consumes partials depends on this leaf;
# nothing depends back.
vernier-partial = { path = "../vernier-partial", version = "0.2.0" }
# Distributed-eval wire format (ADR-0031). rkyv archives the partial
# state; blake3 fingerprints the dataset + params; crc32fast guards the
# wire footer. All three are new top-level deps (the ADR's claim that
# rkyv was already pulled by the RLE codec was incorrect — the codec is
# hand-rolled).
rkyv.workspace = true
blake3.workspace = true
crc32fast.workspace = true
# CSV manifest adapter (ADR-0046 §D2). Converts spreadsheet-shaped
# attribute tables to the canonical JSON-records shape at parse time.
csv = { workspace = true }
# Opt-in inter-image parallelism (ADR-0047). The sequential
# `evaluate_with` path never enters a rayon symbol; the sibling
# `evaluate_with_parallel` is the only consumer.
rayon = { workspace = true }
# Per-thread lazily-initialised storage for the cached segm / boundary
# kernels' compute scratches (ADR-0047). Removes the per-cell
# `Mutex<Scratch>` lock that previously serialised every rayon worker.
thread_local = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Microbenches via divan. Dev-only: never linked into the production
# wheel or any non-bench target. `harness = false` on each [[bench]]
# entry keeps libtest out as well.
divan = "0.1"

[[bench]]
name = "bbox_iou"
harness = false

[[bench]]
name = "boundary_iou"
harness = false

[[bench]]
name = "segm_iou"
harness = false

[[bench]]
name = "evaluate_bbox"
harness = false

[[bench]]
name = "evaluate_segm"
harness = false

[[bench]]
name = "evaluate_boundary"
harness = false
