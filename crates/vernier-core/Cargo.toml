[package]
name = "vernier-core"
description = "Pure-Rust core for the vernier evaluation library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
ndarray.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
pulp.workspace = true
# Pure-Rust mask kernels per ADR-0009. One-way dependency: core consumes
# the codec/rasterizer/ops surface; mask never depends on core.
vernier-mask = { path = "../vernier-mask", version = "0.0.1" }

[dev-dependencies]
proptest = { workspace = true }
# Microbenches via divan. Dev-only: never linked into the production
# wheel or any non-bench target. `harness = false` on each [[bench]]
# entry keeps libtest out as well.
divan = "0.1"

[[bench]]
name = "bbox_iou"
harness = false

[[bench]]
name = "boundary_iou"
harness = false

[[bench]]
name = "segm_iou"
harness = false
