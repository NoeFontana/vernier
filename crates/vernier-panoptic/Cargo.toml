[package]
name = "vernier-panoptic"
description = "Panoptic-quality (PQ) evaluation for the vernier evaluation library (ADR-0025)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["evaluation", "panoptic", "segmentation", "metrics", "coco"]
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
# vernier-mask is a future-load-bearing path dep: instance PQ (this crate)
# does not consume any mask primitive, but boundary PQ (Q3 / Z2 follow-up
# ADR) needs the Chebyshev erosion + boundary-band ops in vernier-mask.
# Declaring the edge up front per ADR-0009 leaf direction so the future
# work does not require a cross-crate refactor.
vernier-mask = { path = "../vernier-mask", version = "0.2.0" }
# Shared partial wire envelope and merge policy (ADR-0032). Carries
# magic + version + framing + the five typed errors used by every
# paradigm. vernier-panoptic plugs its `WirePanopticBody` into the
# same envelope without taking on `vernier-core`'s AP-fold surface.
vernier-partial = { path = "../vernier-partial", version = "0.2.0" }
# rkyv archives the `WirePanopticBody` for the partial wire format
# (ADR-0032).
rkyv.workspace = true
# BLAKE3 fingerprints the categories taxonomy and `(parity_mode,
# things_stuff_split, retain_per_image_deltas)` for cross-rank
# validation in the partial envelope (ADR-0032).
blake3.workspace = true
# PNG decode for the from_files path. Single decoder pin (per ADR-0025
# axis E2): ~150 KB, no umbrella `image` crate.
png = { workspace = true }
# FxHashMap for the per-image intersection histogram. SipHash is wasted
# work on internal `(u32, u32)` keys that never come from user input.
rustc-hash = { workspace = true }
# Opt-in `num_threads` parallel update path (ADR-0047 Stage B). The
# sequential `update` path is unchanged and does not enter any rayon
# symbol at runtime — rayon is linked but the per-image dispatch lives
# under `update_parsed_parallel` only.
rayon = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Microbenches via divan. Dev-only: never linked into the production
# wheel or any non-bench target. `harness = false` on each [[bench]]
# entry keeps libtest out as well.
divan = "0.1"

[[bench]]
name = "pq_image"
harness = false

[[bench]]
name = "decode_kernel"
harness = false
