[package]
name = "vernier-panoptic"
description = "Panoptic-quality (PQ) evaluation for the vernier evaluation library (ADR-0025)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["evaluation", "panoptic", "segmentation", "metrics", "coco"]
categories.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
# vernier-mask is a future-load-bearing path dep: instance PQ (this crate)
# does not consume any mask primitive, but boundary PQ (Q3 / Z2 follow-up
# ADR) needs the Chebyshev erosion + boundary-band ops in vernier-mask.
# Declaring the edge up front per ADR-0009 leaf direction so the future
# work does not require a cross-crate refactor.
vernier-mask = { path = "../vernier-mask", version = "0.0.1" }
# PNG decode for the from_files path. Single decoder pin (per ADR-0025
# axis E2): ~150 KB, no umbrella `image` crate.
png = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
