[package]
name = "vernier-ffi"
description = "PyO3 bindings for the vernier evaluation library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # FFI shim; real distribution is via the wheel.

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = []
# Enabled by maturin during wheel builds. We keep it opt-in so that
# `cargo test -p vernier-ffi` still links (extension-module breaks
# linking against libpython on most platforms).
extension-module = ["pyo3/extension-module"]
# Enables `WorkerMessage::Poison` and `BackgroundEvaluator::_inject_poison_for_tests`
# for the panic-recovery test in tests/python/background/. CI runs
# `maturin develop --features test-poison` for that single job.
test-poison = []
# Stage-0 instrumentation for the bbox-IoU optimization plan: surfaces
# `dump_bbox_iou_histogram(path)` to Python for the bench harness to
# call at end-of-run. Off by default; never compiled into shipped
# wheels.
bench-histogram = ["vernier-core/bench-histogram"]
# ADR-0046 partitioned-eval matching-pass call counter. Surfaces
# `_test_reset_panoptic_matching_count` /
# `_test_read_panoptic_matching_count` and the sibling semantic
# variants so the Python perf tests can assert the matching pass
# runs exactly once regardless of slice count. Off by default; never
# compiled into shipped wheels.
_test-counter = []
# Stage-0 instrumentation for the bbox-scaling investigation: surfaces
# `read_and_reset_evaluate_parallel_timings()` and
# `read_and_reset_build_anns_count()` to Python so the bench harness
# can split `evaluate_with_parallel` wall time and count per-cell
# `Vec<K::Annotation>` allocations. Off by default; never compiled
# into shipped wheels.
bench-timings = ["vernier-core/bench-timings"]
# Stage-0 allocator A/B for the bbox-scaling investigation: swaps the
# process-global allocator to `mimalloc` to bound the contribution of
# glibc-arena contention to the parallel-region scaling shortfall. Off
# by default; the wheel ships with the system allocator unless this
# flag is explicitly set at build time.
mimalloc-global = ["dep:mimalloc"]

[dependencies]
vernier-core = { path = "../vernier-core", version = "0.0.4" }
# Mask kernels (ADR-0009): bitmask ingest calls `Rle::from_raster_bytes`.
vernier-mask = { path = "../vernier-mask", version = "0.0.4" }
# Panoptic-quality evaluation crate (ADR-0025). Sibling to vernier-core;
# the FFI layer wires both through `_core` while keeping their kernels
# independent.
vernier-panoptic = { path = "../vernier-panoptic", version = "0.0.4" }
# Semantic-segmentation evaluation crate (ADR-0028). Sibling to
# vernier-panoptic; depends on vernier-core for ParityMode reuse (the
# documented first asymmetry vs. panoptic). The FFI layer is the only
# place the three paradigms (instance / panoptic / semantic) meet.
vernier-semantic = { path = "../vernier-semantic", version = "0.0.4" }
# Shared partial wire envelope (ADR-0032). The FFI re-uses the leaf
# crate's typed errors directly so the five Python exception classes
# (PartialFormatMismatch, PartialDatasetMismatch, etc.) map back to
# the same shape regardless of which paradigm produced them.
vernier-partial = { path = "../vernier-partial", version = "0.0.4" }
pyo3.workspace = true
numpy.workspace = true
# Arrow columnar buffers for ADR-0019 result tables. Subset is
# deliberate (no `arrow-ipc`, no `arrow-pyarrow`); see workspace
# Cargo.toml for the rationale.
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-data.workspace = true
arrow-schema.workspace = true
# Serde for parsing panoptic segments_info / categories JSON at the
# FFI boundary (ADR-0025). Already pulled in transitively via
# `vernier-core`'s public types; declared explicitly here so the
# `panoptic` module can deserialize without relying on an indirect
# re-export.
serde = { workspace = true }
serde_json = { workspace = true }
# FFI-internal scheduling deps for the background evaluator (ADR-0014).
# Both are best-effort and crate-local; do NOT promote to
# `[workspace.dependencies]` (only one consumer).
thread-priority = "1"
core_affinity = "0.8"
# Allocator A/B for the bbox-scaling investigation (`mimalloc-global`
# feature). Optional and crate-local; do NOT promote to
# `[workspace.dependencies]` (only one consumer, opt-in only).
mimalloc = { version = "0.1", default-features = false, optional = true }
# Opt-in `num_threads` parallelism (ADR-0047). Used at the FFI
# boundary to build scoped per-call pools (batch path) and at
# `BackgroundEvaluator` construction to build the per-worker pool.
# Re-exported from `vernier-core` for the parallel evaluator entry
# points; declared explicitly here so the FFI can build pools and
# install closures without an indirect path through core.
rayon = { workspace = true }
