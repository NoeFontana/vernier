[package]
name = "vernier-ffi"
description = "PyO3 bindings for the vernier evaluation library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # FFI shim; real distribution is via the wheel.

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = []
# Enabled by maturin during wheel builds. We keep it opt-in so that
# `cargo test -p vernier-ffi` still links (extension-module breaks
# linking against libpython on most platforms).
extension-module = ["pyo3/extension-module"]
# Enables `WorkerMessage::Poison` and `BackgroundEvaluator::_inject_poison_for_tests`
# for the panic-recovery test in tests/python/background/. CI runs
# `maturin develop --features test-poison` for that single job.
test-poison = []

[dependencies]
vernier-core = { path = "../vernier-core", version = "0.0.1" }
# Panoptic-quality evaluation crate (ADR-0025). Sibling to vernier-core;
# the FFI layer wires both through `_core` while keeping their kernels
# independent.
vernier-panoptic = { path = "../vernier-panoptic", version = "0.0.1" }
# Semantic-segmentation evaluation crate (ADR-0028). Sibling to
# vernier-panoptic; depends on vernier-core for ParityMode reuse (the
# documented first asymmetry vs. panoptic). The FFI layer is the only
# place the three paradigms (instance / panoptic / semantic) meet.
vernier-semantic = { path = "../vernier-semantic", version = "0.0.1" }
pyo3.workspace = true
numpy.workspace = true
# Arrow columnar buffers for ADR-0019 result tables. Subset is
# deliberate (no `arrow-ipc`, no `arrow-pyarrow`); see workspace
# Cargo.toml for the rationale.
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-data.workspace = true
arrow-schema.workspace = true
# Serde for parsing panoptic segments_info / categories JSON at the
# FFI boundary (ADR-0025). Already pulled in transitively via
# `vernier-core`'s public types; declared explicitly here so the
# `panoptic` module can deserialize without relying on an indirect
# re-export.
serde = { workspace = true }
serde_json = { workspace = true }
# FFI-internal scheduling deps for the background evaluator (ADR-0014).
# Both are best-effort and crate-local; do NOT promote to
# `[workspace.dependencies]` (only one consumer).
thread-priority = "1"
core_affinity = "0.8"
