[project]
name = "vernier-bench-env-vernier"
version = "0.0.0"
description = "uv env for the vernier runner subprocess (ADR-0017)"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }

# This env exists only to materialize a venv with the right dep set —
# the runner module is imported from the ``vernier-bench`` package the
# parent directory provides. uv treats this as a non-package project.
dependencies = [
    "vernier",
    "vernier-bench",
    "numpy>=2.0",
    "pydantic>=2.0",
]

# Path-deps. ``uv sync`` invokes maturin to build vernier from the repo
# root and hatchling to build vernier-bench from ``../../`` .
[tool.uv]
package = false

[tool.uv.sources]
# vernier itself is a maturin/PyO3 build — editable installs need
# `pip install -e` magic that uv can do but the venv pays a per-import
# stub-loader cost. Keep it non-editable; ``just bench-sync`` rebuilds.
vernier = { path = "../../..", editable = false }
# vernier-bench is pure Python — editable lets harness source edits show
# up in the runner subprocess without a re-sync.
vernier-bench = { path = "../..", editable = true }
