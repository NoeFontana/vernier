[project]
name = "vernier-bench-env-ufcoco"
version = "0.0.0"
description = "uv env for the ultrafast-pycocotools runner subprocess (ADR-0017)"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }

# ultrafast-pycocotools ("ufcoco") is a Rust/PyO3 pycocotools-shaped
# surface (``ultrafast_pycocotools.coco.COCO`` /
# ``ultrafast_pycocotools.cocoeval.COCOeval``). The runner imports those
# names directly, like hotcoco's.
dependencies = [
    "vernier-bench",
    "numpy>=2.0",
    "pydantic>=2.0",
    "ultrafast-pycocotools==0.1.14",
]

[tool.uv]
package = false
# Benchmark the PyPI wheel users get, never a local sdist compile whose
# flags could differ from the published build.
no-build-package = ["ultrafast-pycocotools"]

[tool.uv.sources]
vernier-bench = { path = "../..", editable = true }
