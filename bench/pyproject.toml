[project]
name = "vernier-bench"
version = "0.0.0"
description = "Local benchmarking harness for vernier (ADR-0017)"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
# Harness orchestrator deps. The runner subprocesses live in
# envs/<impl>/ with their own dep sets — the orchestrator does not
# import vernier, pycocotools, faster-coco-eval, or boundary-iou-api.
dependencies = [
    "click>=8.1",
    "numpy>=2.0",
    "polars>=1.0",
    "pydantic>=2.0",
    # Single source of truth for the COCO val2017 dev cache contract
    # (URL, SHA256, filename, fetch flow). Path source below.
    "vernier-coco-val-cache",
    # Single source of truth for the LVIS v1 val dev cache (URL,
    # SHA256, perfect-DT synth flow). Path source below; reuses the
    # same fetch+verify shape as the COCO cache.
    "vernier-lvis-val-cache",
    # COCO panoptic val2017 dev cache (ADR-0025); same fetch+verify
    # shape, gated on the same VERNIER_BENCH_DOWNLOAD_TESTS env var.
    "vernier-panoptic-val-cache",
    # Cache-path resolver for real-model predictions (Mask R-CNN
    # downloaded; rf-detr inferred via the TIDE harness). Path source
    # below; transitively pulls platformdirs.
    "vernier-real-predictions-cache",
    # Cache-path resolver for the Cityscapes val dataset (ADR-0033 §B2,
    # ADR-0028). No automatic download (Cityscapes is a gated dataset);
    # the cache locates a user-populated extraction. Path source below.
    "vernier-cityscapes-val-cache",
    # Workload-side: polygon-jittered DT generation needs morphological
    # ops (dilate/erode) and an RLE codec independent of vernier's own
    # mask kernels (using the system under test as the codec for test
    # data is circular). Pycocotools pin matches the parity oracle.
    # Runner envs transitively install these via vernier-bench's path
    # source — small disk cost, simpler user flow than an opt-in extra.
    "scipy>=1.11",
    "pycocotools==2.0.11",
    # psutil drives the streaming RSS sampler (bench/bench/harness/rss.py)
    # used by the B3 streaming + naive-Python runners. Tolerated
    # missing — the sampler returns empty samples + peak=-1 — but
    # pinning the runtime dep avoids a "metric mysteriously absent"
    # surprise in CI.
    "psutil>=5.9",
]

[tool.uv.sources]
vernier-coco-val-cache = { path = "../tools/coco_val_cache", editable = true }
vernier-lvis-val-cache = { path = "../tools/lvis_val_cache", editable = true }
vernier-panoptic-val-cache = { path = "../tools/panoptic_val_cache", editable = true }
vernier-real-predictions-cache = { path = "../tools/real_predictions_cache", editable = true }
vernier-cityscapes-val-cache = { path = "../tools/cityscapes_val_cache", editable = true }

[project.scripts]
vernier-bench = "bench.cli:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15",
    "pyright>=1.1.409",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PT"]

[tool.pyright]
include = ["bench", "tests"]
venvPath = "."
venv = ".venv"
# pythonVersion governs language-feature checks; the resolver follows the
# venv's interpreter (3.14 today) for site-packages.
pythonVersion = "3.10"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
