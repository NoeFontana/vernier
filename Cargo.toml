[workspace]
resolver = "2"
members = [
    "crates/vernier-cli",
    "crates/vernier-core",
    "crates/vernier-ffi",
    "crates/vernier-mask",
    "crates/vernier-panoptic",
    "crates/vernier-partial",
    "crates/vernier-semantic",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoeFontana/vernier"
authors = ["The vernier authors"]
homepage = "https://github.com/NoeFontana/vernier"
keywords = ["evaluation", "metrics", "computer-vision", "detection", "coco"]
categories = ["science", "computer-vision"]

# ---------------------------------------------------------------------------
# Workspace-wide lints. Per the project blueprint, we deny common footguns
# in clippy. unsafe_code is not denied workspace-wide because the FFI crate
# may need carefully-audited unsafe for DLPack interop; each crate states
# its own unsafe policy in its lib.rs.
# ---------------------------------------------------------------------------
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic lints we opt into selectively rather than wholesale.
needless_pass_by_value = "warn"
redundant_clone = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

# ---------------------------------------------------------------------------
# Shared dependency versions. Crates inherit via `dep.workspace = true`.
# Pin minor versions; bumps go through an ADR if they ripple through the FFI.
# ---------------------------------------------------------------------------
[workspace.dependencies]
ndarray = "0.17"
thiserror = "2"
pyo3 = { version = "0.29", default-features = false, features = ["macros", "abi3-py310"] }
numpy = "0.29"
# No stub generator: `python/vernier/_core.pyi` is hand-written on purpose.
# See docs/engineering/python-type-stubs.md for the rationale and for the
# conformance test that keeps it honest.
# Stable-Rust SIMD with runtime CPU-feature dispatch (per ADR-0003).
pulp = "0.22"
# JSON serialization for COCO dataset round-tripping (Phase 1+).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI argument parsing for `vernier-cli` (per ADR-0015). Pinned by
# minor version so the binary's flag surface evolves on a single
# clap version across the workspace.
clap = { version = "4", features = ["derive"] }
# Property-based testing for index invariants and parity fuzz. Dev-dep
# in consumer crates; pinned here so crates inherit a single version.
proptest = "1"
# CLI integration testing for `vernier-cli` (per ADR-0015). Dev-dep only.
assert_cmd = "2"
predicates = "3"
# Arrow columnar buffers for the result-tables FFI (ADR-0019). The
# subset is deliberate: `arrow-array` / `arrow-buffer` / `arrow-schema`
# carry the column types and the C-Data-Interface schema we need for
# the PyCapsule export. We skip the umbrella `arrow` crate, `arrow-ipc`,
# `arrow-csv`, and `arrow-pyarrow` — each is an order of magnitude more
# code, compile time, and wheel weight, for capabilities the table
# surface deliberately does not expose (per ADR-0019 §"Crate
# dependency"). `default-features = false` drops Apache Arrow's
# JSON/CSV/Prettyprint helpers we have no use for.
arrow-array = { version = "55", default-features = false, features = ["ffi"] }
arrow-buffer = { version = "55", default-features = false }
arrow-data = { version = "55", default-features = false, features = ["ffi"] }
arrow-schema = { version = "55", default-features = false, features = ["ffi"] }
# PNG decoder used by `vernier-panoptic::dataset::from_files` (ADR-0025
# axis E2). Single-format decoder (~150 KB), no umbrella `image` crate.
png = "0.18"
# Zero-copy archive format for the partial wire format (ADR-0031). The
# default features include `bytecheck` so `rkyv::access` performs full
# structural validation on deserialize — load-bearing for cross-process
# input. We do not use `alloc`-only mode; std is fine here.
rkyv = "0.8"
# BLAKE3 hashing for the dataset and params fingerprints carried in the
# partial header (ADR-0031). MIT/Apache, SIMD-accelerated.
blake3 = "1"
# CRC32 (IEEE) for the partial wire-format footer (ADR-0031). Catches
# truncation and bit-flips that would slip past `rkyv`'s archive
# validation; the two checks are complementary, not redundant.
crc32fast = "1"
# Faster non-cryptographic hash for internal HashMaps with integer
# keys. The std `HashMap` uses SipHash (DoS-resistant) which is
# overkill for hot-path histograms over `(u32, u32)` keys that never
# touch user-controlled input.
rustc-hash = "2"
# CSV parser used by the manifest CSV adapter (ADR-0046 §D2). Spreadsheet-
# native attribute tables are the primary input for the robotics user;
# the parser converts to the canonical JSON-records shape at parse time
# so the validation path is shared.
csv = "1"
# Shell-style glob expansion for `vernier aggregate --results 'runs/*.json'`
# (ADR-0046 §B2 / §"`vernier aggregate`"). Pure-Rust, single-purpose.
glob = "0.3"
# Data-parallel iterator pool for the opt-in `num_threads` parallelism
# path (ADR-0047). Always linked, never entered at runtime on the
# `num_threads ∈ {None, 1}` default — the FFI boundary routes those
# cases to the unchanged sequential path before any rayon symbol is
# touched. Used as a scoped per-call pool for batch eval and a per-
# worker-lifetime pool for `BackgroundEvaluator`; never the global pool.
rayon = "1.10"
# Per-thread lazily-initialised storage for the segm / boundary
# kernels' compute scratches (ADR-0047). The kernels are shared by
# reference across rayon workers, so the pre-ADR-0047
# `Mutex<Scratch>` shape serialised every per-cell `compute()` call —
# fatal for scaling. `ThreadLocal<RefCell<Scratch>>` gives each worker
# its own scratch on first call, keeping the trait surface unchanged
# and the single-threaded path bit-identical.
thread_local = "1.1"

# ---------------------------------------------------------------------------
# Release profile tuned for FFI workloads: thin LTO + single codegen unit
# gives ~10-20% speedup on the IoU/accumulate inner loops without exploding
# compile times the way fat LTO does. line-tables-only debug info keeps
# wheels small while preserving stack traces.
# ---------------------------------------------------------------------------
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "debuginfo"

# Faster local dev: skip LTO, more codegen units.
[profile.dev]
opt-level = 0

# bench profile mirrors release; divan and criterion both use it.
[profile.bench]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
