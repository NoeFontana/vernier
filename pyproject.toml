[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "vernier"
version = "0.0.1"
description = "High-performance, parity-preserving COCO-style evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "The vernier authors" }]
keywords = ["evaluation", "metrics", "computer-vision", "detection", "coco", "object-detection"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
viz = ["plotly>=6.0"]
# Result tables (ADR-0019). polars is the canonical consumer for the
# Arrow PyCapsule the FFI emits; pandas/duckdb/pyarrow also work and
# are *not* declared here because they are optional alternatives the
# user picks themselves.
tables = ["polars>=1.0"]
# Real-model validation harness (TIDE Week 5). rfdetr is the source of
# RFDETRNano (bbox) + RFDETRSegNano (segm) used by
# tests/python/integration/real_models/tide/. Pinned exact: this is the
# "non-parity sanity-check" vendoring flavor — see
# docs/engineering/vendoring.md and THIRD_PARTY_NOTICES.md. Pulled in
# explicitly via `uv sync --extra real-models`; the @pytest.mark.real_models
# tests skip cleanly when rfdetr is absent.
real-models = ["rfdetr==1.6.5.post0", "platformdirs>=4"]

[project.urls]
Homepage = "https://github.com/NoeFontana/vernier"
Repository = "https://github.com/NoeFontana/vernier"
Documentation = "https://github.com/NoeFontana/vernier#readme"
Issues = "https://github.com/NoeFontana/vernier/issues"

# ---------------------------------------------------------------------------
# Maturin: PyO3 mixed Rust/Python build
# ---------------------------------------------------------------------------
[tool.maturin]
module-name = "vernier._core"
manifest-path = "crates/vernier-ffi/Cargo.toml"
python-source = "python"
features = ["pyo3/extension-module", "extension-module"]
strip = true
# Maturin's sdist is rooted at the FFI crate manifest above, so repo-root
# files (LICENSE-*, …) need an explicit include — without this, PKG-INFO
# declares License-File entries that PyPI rejects as missing on upload.
include = [
    { path = "LICENSE-APACHE", format = "sdist" },
    { path = "LICENSE-MIT",    format = "sdist" },
]

# ---------------------------------------------------------------------------
# uv dev dependencies (PEP 735)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "maturin>=1.13,<2.0",
    "pytest>=9",
    "pytest-benchmark>=5",
    "ruff>=0.15",
    "pyright>=1.1.409",
    # Reference oracle for parity tests. Pinned exact: every quirk we reproduce
    # (see docs/engineering/pycocotools-quirks.md) is keyed to this version.
    # Bumping this is an ADR-level decision, not a routine dep update.
    # 2.0.11 is the first release that links cleanly against NumPy 2.0+.
    "pycocotools==2.0.11",
    # Boundary-IoU oracle dependency: bowenc0221/boundary-iou-api's
    # mask_to_boundary calls cv2.erode + cv2.copyMakeBorder. Pin mirrored by
    # ORACLE_OPENCV_PIN in crates/vernier-core/src/boundary_parity.rs; both
    # update atomically. Bumping is ADR-level (see ADR-0010 §"Oracle (E2 + E3)").
    "opencv-python==4.10.0.84",
    # LVIS reference oracle (ADR-0026). Vendored verbatim under
    # tests/python/parity_lvis/oracle/lvis_api/ at the same SHA, but
    # `pip install lvis==0.5.3` is the canonical way users obtain the
    # package — pinning it here pulls in the matplotlib/numpy
    # transitive deps the vendored tree imports at module load.
    # Pin mirrored by ORACLE_LVIS_VERSION in
    # crates/vernier-core/src/lvis_parity.rs; both update atomically.
    # Bumping is ADR-level (see ADR-0026 §"Parity strategy").
    "lvis==0.5.3",
    # Result tables consumer (ADR-0019). polars validates the Arrow
    # PyCapsule round-trip in tests/python/tables/. Available to the
    # `tables` extra for end users; mirrored here so tests can rely on
    # it without conditional skips.
    "polars>=1.0",
    # Single source of truth for the COCO val2017 dev cache contract
    # (URL, SHA256, filename, fetch flow). Path source declared below
    # in [tool.uv.sources]. Consumed by tests/python/coco_val_paths.py
    # and tools/fetch-coco-val.sh; bench has its own copy of the dep
    # since bench resolves against its own pyproject.
    "vernier-coco-val-cache",
    # Same shape, LVIS v1 val flavor (ADR-0026 PR-6). Single source of
    # truth for the URL + SHA256 of `lvis_v1_val.json`; consumed by
    # `tests/python/parity_lvis/lvis_val_paths.py` and the
    # `python -m lvis_val_cache` CLI.
    "vernier-lvis-val-cache",
    # Panoptic oracle dependency (ADR-0025): `panopticapi/evaluation.py`
    # imports `PIL.Image` at module scope and decodes panoptic PNGs via
    # `np.array(Image.open(path), dtype=np.uint32)`. Pin mirrored by
    # ORACLE_PILLOW_PIN in crates/vernier-panoptic/src/parity.rs; both
    # update atomically. Bumping is ADR-level.
    "Pillow==12.2.0",
    # COCO panoptic val2017 cache (ADR-0025 PR-6). Single source of
    # truth for the URL + SHA256 of the panoptic GT zip; consumed by
    # `tests/python/parity_panoptic/test_panoptic_val.py` and the
    # `python -m panoptic_val_cache` CLI.
    "vernier-panoptic-val-cache",
    # Real-model predictions cache (Mask R-CNN downloaded; rf-detr
    # inferred via the TIDE harness). Single source of truth for the
    # cache-path contract shared between bench's real-prediction adapter
    # and `tools/fetch-real-predictions.sh`.
    "vernier-real-predictions-cache",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mike>=2.1",
    "mkdocs-redirects>=1.2",
    "codespell>=2.3",
]

[tool.uv.sources]
vernier-coco-val-cache = { path = "tools/coco_val_cache", editable = true }
vernier-lvis-val-cache = { path = "tools/lvis_val_cache", editable = true }
vernier-panoptic-val-cache = { path = "tools/panoptic_val_cache", editable = true }
vernier-real-predictions-cache = { path = "tools/real_predictions_cache", editable = true }

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python", "tests/python"]
# tests/python/parity_boundary/oracle/boundary_iou_api/ is verbatim vendored
# upstream code (BSD-2-Clause). Linting it is both pointless (we don't
# modify it) and incorrect (we'd be enforcing our style on someone else's
# project). See VENDORING.md alongside.
# bench/ is the local-only benchmark harness (ADR-0017) — it has its own
# pyproject.toml + ruff config and is linted via its own pipeline.
extend-exclude = [
    "target",
    ".venv",
    "tests/python/parity_boundary/oracle/boundary_iou_api",
    "tests/python/parity_lvis/oracle/lvis_api",
    "tests/python/parity_panoptic/oracle/panopticapi",
    "bench",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
    "N",             # pep8-naming
    "PT",            # pytest style
    "PYI",           # stub files
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N802"]   # tests can be sloppier
# `_core.pyi` mirrors PyO3 #[pyclass] names from vernier-ffi; the
# `Partial*Mismatch`/`Partial*Overlap`/`Partial*Collision` exception
# classes are part of the shipped public surface (ADR-0032 §"Errors")
# and cannot be renamed without a coordinated Rust + Python break.
"python/vernier/_core.pyi" = ["N818"]

# ---------------------------------------------------------------------------
# Pyright: strict on the public API, warn on tests
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["python", "tests/python"]
# Resolve `vernier` from the source layout so pyright works without an
# editable install (CI lint job runs with `uv sync --no-install-project`
# to skip the maturin Rust build).
extraPaths = ["python"]
exclude = [
    "**/__pycache__",
    "target",
    ".venv",
    # Verbatim vendored upstream — see VENDORING.md alongside.
    "tests/python/parity_boundary/oracle/boundary_iou_api",
    "tests/python/parity_lvis/oracle/lvis_api",
    "tests/python/parity_panoptic/oracle/panopticapi",
    # ADR-0017 bench harness — typed independently from its own pyproject.
    "bench",
    # Real-model validation harness — depends on the `real-models` extra
    # (rfdetr / supervision / torch) which is not in the default sync.
    # Same philosophy as the bench exclude: opt-in heavy code that we
    # don't gate `just lint` on. Linted by ruff (style) but not typed.
    "tests/python/integration/real_models",
]
strict = ["python/vernier"]
pythonVersion = "3.10"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-markers --strict-config"
# Don't descend into the vendored boundary-IoU oracle tree — it's not
# vernier's tests, and pytest collection would try to import modules that
# need opencv-python at module load time. The harness adds the oracle to
# sys.path explicitly when it needs to run reference comparisons.
norecursedirs = [
    ".venv",
    "target",
    "tests/python/parity_boundary/oracle/boundary_iou_api",
    "tests/python/parity_lvis/oracle/lvis_api",
    "tests/python/parity_panoptic/oracle/panopticapi",
]
markers = [
    "slow: marks tests as slow (skip with -m 'not slow')",
    "parity: parity tests against the pycocotools reference oracle",
    "parity_boundary: parity tests against the bowenc0221/boundary-iou-api reference oracle",
    "parity_lvis: parity tests against the lvis-dataset/lvis-api reference oracle (ADR-0026)",
    "parity_lvis_val: LVIS v1 val whole-dataset parity smoke (skipped unless VERNIER_LVIS_*_PATH env vars point at real files)",
    "parity_panoptic: parity tests against the cocodataset/panopticapi reference oracle (ADR-0025)",
    "parity_panoptic_val: COCO panoptic val2017 whole-dataset parity smoke (skipped unless VERNIER_PANOPTIC_*_PATH env vars point at real files)",
    "coco_val: whole-dataset parity smoke (skipped unless VERNIER_COCO_*_PATH env vars point at real files)",
    "real_models: real-model validation harness (rfdetr) — heavy, opt-in only, skipped unless the real-models extra is installed and VERNIER_COCO_CACHE points at val2017 GT + images",
]
