# cargo-deny configuration. Run with `just audit` or `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # `paste` is archived/unmaintained, pulled transitively by `pulp` (our
    # ADR-0003 SIMD dispatch crate). No upstream replacement is available
    # and `pulp` has no published version that drops the dep. Revisit when
    # `pulp` migrates (e.g., to `pastey`).
    { id = "RUSTSEC-2024-0436", reason = "transitive via pulp; no fix upstream" },
]
yanked = "deny"

[licenses]
version = 2
# Allowlist. If a dep brings in a license not on this list, the build fails;
# add it here only after a deliberate review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
