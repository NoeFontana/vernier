[project]
name = "vernier-lvis-v1-val-cache"
version = "0.0.0"
description = "Single source of truth for the LVIS v1 val (real-prediction) dev cache contract."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lvis_v1_val_cache"]
