[package]
name = "vernier-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Detach from the parent workspace so workspace-level lints and
# toolchain pins don't apply here.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
vernier-core = { path = "../../crates/vernier-core" }
vernier-mask = { path = "../../crates/vernier-mask" }

[[bin]]
name = "fuzz_coco_dataset"
path = "fuzz_targets/fuzz_coco_dataset.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_coco_detections"
path = "fuzz_targets/fuzz_coco_detections.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_panoptic_segments"
path = "fuzz_targets/fuzz_panoptic_segments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_manifest"
path = "fuzz_targets/fuzz_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_rle_counts"
path = "fuzz_targets/fuzz_rle_counts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_segmentation"
path = "fuzz_targets/fuzz_segmentation.rs"
test = false
doc = false
bench = false
