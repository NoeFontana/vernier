[project]
name = "vernier-cityscapes-val-cache"
version = "0.0.0"
description = "Single source of truth for the Cityscapes val dev cache contract (ADR-0028, ADR-0033 §B2)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cityscapes_val_cache"]
