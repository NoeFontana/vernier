[project]
name = "vernier-objects365-val-cache"
version = "0.0.0"
description = "Single source of truth for the Objects365 v2 val annotation cache (bench workload)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["objects365_val_cache"]
