name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Monthly Linux-only canary to catch toolchain drift between releases.
  # macOS/Windows are reserved for release-candidate builds (tag pushes
  # and manual workflow_dispatch) — those runners bill at 10×/2× and
  # routine drift detection on Linux is sufficient.
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{ matrix.target }} ${{ matrix.manylinux }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        manylinux: [auto, musllinux_1_2]
        # aarch64 builds natively: the cross image's GCC 4.8 cannot compile
        # mimalloc (ADR-0070); pypa's native manylinux2014 image has a
        # current GCC and the same glibc 2.17 floor.
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: Swatinem/rust-cache@v2
        with:
          key: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --strip
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  macos:
    name: macos ${{ matrix.target }}
    # Skip on schedule: macOS runners bill 10× and are reserved for tag /
    # manual release-candidate builds.
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: Swatinem/rust-cache@v2
        with:
          key: wheels-macos-${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --strip
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: windows ${{ matrix.target }}
    # Skip on schedule: Windows runners bill 2× and are reserved for tag /
    # manual release-candidate builds.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          architecture: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: wheels-windows-${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --strip
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  # Source distribution. Linux-only (sdist is platform-independent) and
  # gated on tag pushes / manual dispatch — the monthly canary skips it
  # because the canary's job is just toolchain drift detection.
  sdist:
    name: sdist
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Per blueprint section 5: install each built wheel that the runner can
  # execute into a fresh environment and run tools/dev/wheel_smoke.py —
  # load, evaluate sequentially and threaded, and on Linux fork while a
  # thread evaluates (the allocator, ADR-0070). Catches FFI bridge /
  # dynamic linker / allocator breakage that cargo and pytest don't see.
  smoke:
    name: smoke ${{ matrix.wheel }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wheel: linux-x86_64-auto
            runner: ubuntu-latest
          - wheel: linux-aarch64-auto
            runner: ubuntu-24.04-arm
          - wheel: linux-x86_64-musllinux_1_2
            runner: ubuntu-latest
            image: python:3.13-alpine
          - wheel: linux-aarch64-musllinux_1_2
            runner: ubuntu-24.04-arm
            image: python:3.13-alpine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.wheel }}
          path: dist
      - uses: actions/setup-python@v7
        if: matrix.image == ''
        with:
          python-version: "3.14"
      - name: smoke (glibc)
        if: matrix.image == ''
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/vernier-*.whl
          /tmp/smoke/bin/python tools/dev/wheel_smoke.py
      - name: smoke (musl)
        if: matrix.image != ''
        run: |
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} \
            sh -c 'pip install dist/vernier-*.whl && python tools/dev/wheel_smoke.py'

  smoke-desktop:
    name: smoke ${{ matrix.wheel }}
    needs: [macos, windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wheel: macos-aarch64
            runner: macos-latest
          - wheel: windows-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.wheel }}
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: smoke
        shell: bash
        run: |
          python -m venv smoke
          bin=smoke/bin; [ -d smoke/Scripts ] && bin=smoke/Scripts
          "$bin/python" -m pip install dist/vernier-*.whl
          "$bin/python" tools/dev/wheel_smoke.py

  # Tag-gated guard: refuse to publish a vX.Y.Z tag that doesn't match
  # workspace.package.version (Cargo.toml) and project.version
  # (pyproject.toml). Catches a forgotten version bump before either
  # registry has a chance to accept the upload — neither PyPI nor
  # crates.io permits re-uploading the same version, so a mismatch
  # caught after publish costs a patch bump.
  verify-tag:
    name: verify tag matches workspace version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: assert tag == workspace.package.version == project.version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          ws_version="$(awk -F '"' '/^\[workspace.package\]/{f=1} f && /^version *= *"/{print $2; exit}' Cargo.toml)"
          py_version="$(awk -F '"' '/^\[project\]/{f=1} f && /^version *= *"/{print $2; exit}' pyproject.toml)"
          echo "tag=${tag}  workspace=${ws_version}  pyproject=${py_version}"
          if [[ "$tag" != "$ws_version" || "$tag" != "$py_version" ]]; then
            echo "::error::tag v${tag} does not match workspace=${ws_version} / pyproject=${py_version}" >&2
            exit 1
          fi

  # PyPI publish via Trusted Publisher (OIDC — no API token stored in
  # GitHub secrets). Requires the `vernier` Trusted Publisher set up at
  # https://pypi.org/manage/account/publishing/ pointing at this
  # workflow with `Environment` left blank.
  #
  # No `environment:` gate on the job: GitHub Actions only enforces the
  # required-reviewer protection rule on private repos under Pro/Team
  # tiers. On free-tier private repos the gate is a no-op, which is
  # worse than no gate (it implies a checkpoint that doesn't exist).
  # `verify-tag` plus deliberate tag pushes are the safety net; revisit
  # this when the repo goes public or upgrades to a tier that enforces
  # environment protections.
  publish-pypi:
    name: publish to PyPI
    needs: [linux, macos, windows, smoke, smoke-desktop, sdist, verify-tag]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for Trusted Publisher
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PEP 740: sigstore-sign each artifact and upload the
          # attestation alongside it. PyPI verifies and exposes the
          # attestation on the project page; supply-chain-conscious
          # consumers (`pip --require-hashes`, `pip-audit`,
          # security-scanning tools) gate installs on it. Requires the
          # OIDC `id-token: write` permission already granted on this
          # job and is a no-op for non-Trusted-Publisher uploads.
          attestations: true

  # crates.io publish via Trusted Publisher (OIDC — no
  # CARGO_REGISTRY_TOKEN secret). Requires Trusted Publishers set up at
  # https://crates.io/me/trusted-publishers FOR EACH crate (the seven
  # listed below) with `Environment` left blank — crates.io scopes
  # publishers per crate, unlike PyPI's per-project scope.
  #
  # No `environment:` gate on the job for the same reason as
  # `publish-pypi` above: free-tier private-repo environments don't
  # enforce protection rules.
  #
  # Order is a topological sort of the workspace's internal dep graph:
  #   vernier-mask    (leaf)
  #   vernier-partial (leaf)
  #   vernier-core      depends on mask + partial
  #   vernier-panoptic  depends on mask + partial
  #   vernier-semantic  depends on core + partial
  #   vernier-cli       depends on core
  #   vernier           the facade — depends on everything (ADR-0048)
  # Modern cargo blocks until the index reflects each new version, so
  # sequential publish is sufficient (no manual sleep). `vernier-ffi` is
  # `publish = false` and ships only inside the wheel.
  #
  # The facade is last by construction: its path deps pin the workspace
  # version, so it cannot resolve until the six crates ahead of it are
  # on the index. Its trusted-publisher entry is a `publish-update`
  # scope (we already own the name from the retired v0.0.0
  # placeholder) — see docs/engineering/release-runbook.md
  # §"One-off: the first release that includes the facade".
  publish-crates-io:
    name: publish to crates.io
    needs: [linux, macos, windows, smoke, smoke-desktop, verify-tag]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for crates-io-auth-action
      contents: read    # actions/checkout
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # No `Swatinem/rust-cache` here on purpose — `cargo publish` packs
      # each crate from a clean state into its own scratch dir, so any
      # cached `target/` is dead weight.
      - name: mint short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish vernier-mask
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p vernier-mask
      - name: cargo publish vernier-partial
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p vernier-partial
      - name: cargo publish vernier-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p vernier-core
      - name: cargo publish vernier-panoptic
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p vernier-panoptic
      - name: cargo publish vernier-semantic
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p vernier-semantic
      - name: cargo publish vernier-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p vernier-cli
      - name: cargo publish vernier
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p vernier
