name: PyPI Reserve

# One-shot workflow that publishes the v0.0.0 PyPI name reservation under
# tools/reservations/pypi/vernier/. The first successful run claims the
# `vernier` name on PyPI via Trusted Publisher (OIDC) — no API token
# stored anywhere. Once the real wheel ships from `wheels.yml`, this
# workflow can be deleted.
#
# Manual trigger only: pushing tags or schedule runs would risk publishing
# the placeholder by accident.

on:
  workflow_dispatch:

jobs:
  publish:
    name: build and publish PyPI placeholder
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE workflow-level permissions, not merge
    # with them — both must be listed here, otherwise actions/checkout
    # gets "Repository not found" on a private repo.
    permissions:
      contents: read    # actions/checkout
      id-token: write   # Trusted Publisher OIDC
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: build placeholder sdist + wheel
        working-directory: tools/reservations/pypi/vernier
        run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: tools/reservations/pypi/vernier/dist/
          # No password / API token: PyPI authenticates the upload via the
          # OIDC token GitHub mints from the id-token: write permission
          # above, matched against the Trusted Publisher configured at
          # https://pypi.org/manage/account/publishing/.
