name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-rust:
    name: lint (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-rust:
    name: test (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --workspace

  audit:
    name: audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  python:
    name: lint + test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: install python
        run: uv python install ${{ matrix.python-version }}
      - name: sync deps
        run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: maturin develop
        run: uv run --python ${{ matrix.python-version }} maturin develop --release
      - name: ruff check
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: ruff format check
        run: uv run --python ${{ matrix.python-version }} ruff format --check .
      - name: pyright
        run: uv run --python ${{ matrix.python-version }} pyright
      - name: pytest
        run: uv run --python ${{ matrix.python-version }} pytest
