name: CI

on:
  # PR is the gate: every change reaches main through a PR, and the PR
  # CI tests that exact merge commit. Re-running everything on push to
  # main would just duplicate work — `wheels.yml` covers tag-time
  # release builds.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
      - ".github/workflows/wheels.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-rust:
    name: lint (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # ADR-0048 gate for the facade crate. Its three features are
      # additive and re-export-only, so every combination must compile
      # and none may be empty. Cheap (one source file, no dependency
      # rebuild across combinations) and it is what keeps the
      # "cfg gates a `pub use` and nothing else" invariant from
      # decaying into a comment.
      - name: cargo hack (facade feature powerset)
        run: cargo hack --feature-powerset check -p vernier
      # cargo-deny piggy-backs on the Rust toolchain + checkout already
      # set up here, so it runs as a final lint step rather than as its
      # own job (saves a runner cold-start per PR).
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

  test-rust:
    name: test (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --workspace
      # nextest does not run doctests; cover them in a separate step
      # so /// example blocks stay compiling. vernier-ffi excluded —
      # it's a PyO3 cdylib needing libpython at link time, unavailable
      # on the CI runner.
      - name: cargo test --doc
        run: cargo test --doc --workspace --exclude vernier-ffi

  # Cross-architecture bit-equality pin for the f64 bbox-IoU expression
  # (ADR-0056). The union denominator `g_area + d_area - inter` contains
  # two multiply-then-add patterns that a compiler with floating-point
  # contraction enabled may fuse into FMAs, dropping a rounding step and
  # moving the result 1-2 ULP off pycocotools' unfused value — enough to
  # flip a match under quirk B2 and shift AP (ADR-0008).
  #
  # rustc does not contract today, but that is an inherited default, not
  # something this build states, and `-Zfp-contract` is nightly-only so
  # there is no stable switch to assert it with. The golden bit patterns
  # in `similarity::bbox::fp_contract_pin` are the assertion instead, and
  # this job is what makes them *cross-architecture*: aarch64 has `fmadd`
  # in its baseline ISA and we ship aarch64 wheels (`wheels.yml`), so a
  # contraction regression would be a wrong answer on one wheel and not
  # the other — the hardest kind to notice.
  #
  # Two things this job does that `test-rust` above does not:
  #   * `--release`. Contraction and auto-vectorization only happen under
  #     optimization; a debug run would pass even on a toolchain that
  #     contracts. This is the profile the shipped wheel uses (and
  #     deliberately not `target-cpu=native`, per the bench discipline).
  #   * `--no-tests=fail`. A filter expression that matches nothing exits
  #     0 by default, which would turn a rename into a silently vacuous
  #     green job.
  test-rust-cross-arch:
    name: fp-contract bit-equality (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: fp-contract-${{ matrix.arch }}
      - uses: taiki-e/install-action@nextest
      - name: bbox IoU golden bits (release, ${{ matrix.arch }})
        run: >
          cargo nextest run --release -p vernier-core
          --no-tests=fail -E 'test(fp_contract)'

  # Builds rustdoc with the same `--cfg docsrs` flag docs.rs uses,
  # under `-D warnings` so broken intra-doc links and feature-gate
  # breakage fail the PR rather than slipping through to docs.rs at
  # release time.
  docs-rust:
    name: docs (rust)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings --cfg docsrs"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Two invocations, not one. `vernier-cli`'s binary target is named
      # `vernier` (ADR-0015) and so is the facade library (ADR-0048), so
      # documenting both in a single pass collides on
      # `target/doc/vernier/` — a known cargo bug (rust-lang/cargo#6313).
      # Splitting keeps rustdoc coverage over every target; the second
      # run reuses the first's target dir, so it costs one small rustdoc
      # invocation.
      - name: cargo doc (libraries)
        run: cargo doc --workspace --exclude vernier-ffi --exclude vernier-cli --no-deps --all-features
      - name: cargo doc (vernier-cli binary)
        run: cargo doc -p vernier-cli --no-deps --all-features

  # Build the abi3 wheel once. Because pyo3 is pinned to abi3-py310
  # (Cargo.toml), the resulting wheel installs into Python 3.10–3.14
  # unchanged — so we don't rebuild per matrix leg.
  build-wheel:
    name: build wheel (abi3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: install python (abi3 floor)
        run: uv python install 3.10
      - name: sync build deps
        run: uv sync --no-install-project --python 3.10
      - name: maturin build (debug)
        run: uv run --python 3.10 maturin build --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-abi3
          path: dist/*.whl
          # Job-to-job pipe for test-py, not a deliverable — release wheels
          # come from wheels.yml. 1 day is the floor; the repo-wide default
          # retention is only a ceiling, so this must be set per-upload.
          retention-days: 1

  lint-py:
    name: lint (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: install python
        run: uv python install 3.13
      # --no-install-project skips building the Rust extension. Pyright
      # resolves vernier._core via python/vernier/_core.pyi (stub file).
      - name: sync python deps (no rust build)
        run: uv sync --all-extras --no-install-project --python 3.13
      - name: ruff check
        run: uv run --no-sync --python 3.13 ruff check .
      - name: ruff format check
        run: uv run --no-sync --python 3.13 ruff format --check .
      - name: pyright
        run: uv run --no-sync --python 3.13 pyright
      # Quirk-survey `Wired-by` citations resolve to real names. Stdlib
      # only — no build, no imports; see tools/check_quirk_citations.py.
      - name: quirk citations
        run: python3 tools/check_quirk_citations.py

  test-py:
    # The `numpy` suffix appears only on the NumPy 1 leg, so the locked
    # legs keep the `test (python X)` names the main ruleset requires.
    name: test (python ${{ matrix.python-version }}${{ matrix.numpy != 'locked' && format(', numpy {0}', matrix.numpy) || '' }})
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # abi3 floor + ceiling. The middle versions (3.11/3.12/3.13)
        # share the same abi3-py310 wheel, so per-version test runs are
        # rarely informative; `slow.yml` (workflow_dispatch) backfills
        # the full suite before a release cut.
        python-version: ["3.10", "3.14"]
        # `locked` runs the NumPy uv.lock resolves (2.x). The extension
        # is one abi3 wheel that rust-numpy binds to NumPy 1 or 2 at
        # runtime, so NumPy 1 support is only proven by running the suite
        # against it: the `numpy>=1.26` floor on the oldest Python.
        numpy: ["locked"]
        include:
          - python-version: "3.10"
            numpy: "1.26.4"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: install python
        run: uv python install ${{ matrix.python-version }}
      - name: sync test deps (no rust build)
        run: uv sync --all-extras --no-install-project --python ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel-abi3
          path: dist
      - name: install built wheel
        run: uv pip install --python ${{ matrix.python-version }} dist/vernier-*.whl
      - name: pin numpy
        if: matrix.numpy != 'locked'
        run: uv pip install --python ${{ matrix.python-version }} "numpy==${{ matrix.numpy }}"
      - name: pytest
        # PR gate skips the slow tier (boundary parity tree, env-gated
        # *_val.py whole-dataset smokes). Run the full suite via the
        # `slow.yml` workflow_dispatch before cutting a release.
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest -m "not slow"
      # Completeness of the shipped typed surface. Needs the *installed*
      # distribution (it reads the packaged `py.typed` and does not honour
      # pyright's `extraPaths`), so it cannot live in the
      # `--no-install-project` lint job. Pinned to the newest interpreter:
      # the score depends on the numpy version uv resolves, and the 3.10
      # environment scores 96.2% on pre-existing `ndarray` / `Mapping` type
      # arguments in _tide.py and semantic/. See
      # docs/engineering/python-type-stubs.md.
      - name: pyright --verifytypes
        if: matrix.python-version == '3.14'
        run: >
          uv run --no-sync --python ${{ matrix.python-version }}
          pyright --verifytypes vernier --ignoreexternal

  # Single required status check for branch protection.
  #
  # This workflow is `paths-ignore`d for docs and Markdown, which is
  # right — a typo fix should not run the whole matrix. But a required
  # check that never runs is not "passed", it is *pending forever*, so a
  # docs-only PR could not be merged at all: #315 was the repo's first
  # one and deadlocked on exactly this.
  #
  # `if: always()` makes this job run even when every job it needs was
  # skipped, so protection has something that always reports. Require
  # THIS check on main instead of the individual jobs.
  ci-complete:
    name: CI complete
    if: always()
    needs:
      - lint-rust
      - test-rust
      - test-rust-cross-arch
      - docs-rust
      - build-wheel
      - lint-py
      - test-py
    runs-on: ubuntu-latest
    steps:
      # A skipped dependency is a pass (the paths filter excluded it);
      # only `failure` and `cancelled` are not. Checking the results
      # explicitly rather than relying on the default `success()` gate,
      # which treats a skipped need as a non-success and would reinstate
      # the deadlock it is here to remove.
      # The results arrive via `env` rather than interpolated into the
      # script. GitHub expressions accept ONLY single-quoted string
      # literals, so `join(needs.*.result, " ")` is a parse error that
      # invalidates the entire workflow file -- it does not fail the job,
      # it stops every job in the file from loading. Passing through
      # `env` keeps the separator quoting out of the shell's way, and
      # keeps the expression out of the script body.
      - name: Verify no job failed
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $NEEDS_RESULTS"
          for r in $NEEDS_RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$r'"; exit 1 ;;
            esac
          done
