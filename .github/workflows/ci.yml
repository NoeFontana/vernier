name: CI

on:
  # PR is the gate: every change reaches main through a PR, and the PR
  # CI tests that exact merge commit. Re-running everything on push to
  # main would just duplicate work — `wheels.yml` covers tag-time
  # release builds.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
      - "tools/reservations/**"
      - ".github/workflows/wheels.yml"
      - ".github/workflows/pypi-reserve.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-rust:
    name: lint (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-rust:
    name: test (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest
        run: cargo nextest run --workspace

  audit:
    name: audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Build the abi3 wheel once. Because pyo3 is pinned to abi3-py310
  # (Cargo.toml), the resulting wheel installs into Python 3.10–3.14
  # unchanged — so we don't rebuild per matrix leg.
  build-wheel:
    name: build wheel (abi3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: install python (abi3 floor)
        run: uv python install 3.10
      - name: sync build deps
        run: uv sync --no-install-project --python 3.10
      - name: maturin build (debug)
        run: uv run --python 3.10 maturin build --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-abi3
          path: dist/*.whl

  lint-py:
    name: lint (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: install python
        run: uv python install 3.13
      # --no-install-project skips building the Rust extension. Pyright
      # resolves vernier._core via python/vernier/_core.pyi (stub file).
      - name: sync python deps (no rust build)
        run: uv sync --all-extras --no-install-project --python 3.13
      - name: ruff check
        run: uv run --no-sync --python 3.13 ruff check .
      - name: ruff format check
        run: uv run --no-sync --python 3.13 ruff format --check .
      - name: pyright
        run: uv run --no-sync --python 3.13 pyright

  test-py:
    name: test (python ${{ matrix.python-version }})
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # abi3 floor + ceiling. The middle versions (3.11/3.12/3.13)
        # share the same abi3-py310 wheel, so per-version test runs are
        # rarely informative; a monthly cron could backfill if needed.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: install python
        run: uv python install ${{ matrix.python-version }}
      - name: sync test deps (no rust build)
        run: uv sync --all-extras --no-install-project --python ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel-abi3
          path: dist
      - name: install built wheel
        run: uv pip install --python ${{ matrix.python-version }} dist/vernier-*.whl
      - name: pytest
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest
