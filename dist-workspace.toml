[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell", "powershell"]
# Per ADR-0015 (original three triples) + ADR-0034 (adds
# aarch64-linux-gnu). `x86_64-apple-darwin` is intentionally absent —
# Intel Mac audience is a separate signal question, deferred.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
install-path = "CARGO_HOME"
hosting = "github"
install-updater = false
